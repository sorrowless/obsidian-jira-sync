name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Documentation and build gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Run CI check
        run: make ci
